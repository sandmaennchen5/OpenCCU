# OpenCCU OCI snapshot build for GitHub-hosted runners
# yamllint disable rule:truthy
---
name: Snapshot OCI Build

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "OCI platform(s) to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - oci_amd64
          - oci_arm64

permissions:
  contents: read

jobs:
  ###########################################################################
  # Determine snapshot version once for all matrix jobs
  ###########################################################################
  prepare:
    name: Prepare Build
    runs-on: ubuntu-24.04

    outputs:
      date: ${{ steps.env.outputs.date }}
      occu_version: ${{ steps.env.outputs.occu_version }}
      build_version: ${{ steps.env.outputs.build_version }}
      sha7: ${{ steps.env.outputs.sha7 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        id: env
        shell: bash
        run: |
          DATE="$(date +%Y%m%d)"
          OCCU_VERSION="$(
            grep 'OCCU_VERSION =' \
              buildroot-external/package/occu/occu.mk \
              | cut -d' ' -f3 \
              | cut -d'-' -f1
          )"
          BUILD_VERSION="${OCCU_VERSION}.${DATE}"
          SHA7="${GITHUB_SHA::7}"

          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "occu_version=${OCCU_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha7=${SHA7}" >> "$GITHUB_OUTPUT"

          echo "DATE=${DATE}"
          echo "OCCU_VERSION=${OCCU_VERSION}"
          echo "BUILD_VERSION=${BUILD_VERSION}"
          echo "SHA7=${SHA7}"

  ###########################################################################
  # Build OCI root filesystems
  ###########################################################################
  build:
    name: Snapshot build [${{ matrix.platform }}]

    runs-on: ubuntu-24.04

    needs:
      - prepare

    timeout-minutes: 300

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(
          github.event.inputs.platforms == 'all'
          && '["oci_amd64","oci_arm64"]'
          || format('["{0}"]', github.event.inputs.platforms)
          ) }}

    steps:
      #######################################################################
      # Checkout
      #######################################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #######################################################################
      # Free some disk space
      #######################################################################
      - name: Free Disk Space
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          sudo apt-get clean

          echo "Disk usage after cleanup:"
          df -h

      #######################################################################
      # Install dependencies
      #######################################################################
      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gcc \
            g++ \
            make \
            git \
            wget \
            curl \
            bc \
            cpio \
            rsync \
            unzip \
            zip \
            python3 \
            file \
            jq \
            perl \
            patch \
            diffutils \
            bzip2 \
            gzip \
            xz-utils \
            tar \
            libncurses-dev \
            ca-certificates

      #######################################################################
      # Prepare paths expected by the OpenCCU Makefile
      #
      # Upstream uses:
      #   /mnt/download
      #   /mnt/ccache/<platform>
      #
      # These directories don't exist on GitHub-hosted runners and cannot
      # normally be created by the unprivileged runner user.
      #######################################################################
      - name: Prepare Build Directories
        shell: bash
        run: |
          sudo mkdir -p /mnt/download
          sudo mkdir -p "/mnt/ccache/${{ matrix.platform }}"

          sudo chown -R "$(id -u):$(id -g)" /mnt/download
          sudo chown -R "$(id -u):$(id -g)" /mnt/ccache

          chmod -R u+rwX /mnt/download
          chmod -R u+rwX /mnt/ccache

          ls -ld /mnt/download
          ls -ld /mnt/ccache
          ls -ld "/mnt/ccache/${{ matrix.platform }}"

      #######################################################################
      # Environment
      #######################################################################
      - name: Setup Build Environment
        shell: bash
        run: |
          echo "DATE=${{ needs.prepare.outputs.date }}" >> "$GITHUB_ENV"
          echo "OCCU_VERSION=${{ needs.prepare.outputs.occu_version }}" >> "$GITHUB_ENV"
          echo "VERSION=${{ needs.prepare.outputs.build_version }}" >> "$GITHUB_ENV"
          echo "GITHUB_SHA7=${{ needs.prepare.outputs.sha7 }}" >> "$GITHUB_ENV"

          JLEVEL=0

          if [[ -f /sys/fs/cgroup/cpu.max ]]; then
            CPU_QUOTA="$(cut -d ' ' -f1 /sys/fs/cgroup/cpu.max)"

            if [[ "${CPU_QUOTA}" != "max" ]]; then
              CPU_PERIOD="$(cut -d ' ' -f2 /sys/fs/cgroup/cpu.max)"
              JLEVEL=$((CPU_QUOTA / CPU_PERIOD + 1))
            fi
          elif [[ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]]; then
            CPU_QUOTA="$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us)"

            if [[ "${CPU_QUOTA}" != "-1" ]]; then
              CPU_PERIOD="$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us)"
              JLEVEL=$((CPU_QUOTA / CPU_PERIOD + 1))
            fi
          fi

          # If GitHub doesn't expose a CPU quota, let make/Buildroot decide.
          echo "JLEVEL=${JLEVEL}" >> "$GITHUB_ENV"

          echo "DATE=${{ needs.prepare.outputs.date }}"
          echo "VERSION=${{ needs.prepare.outputs.build_version }}"
          echo "JLEVEL=${JLEVEL}"

      #######################################################################
      # Snapshot EULA
      #######################################################################
      - name: Switch to Snapshot EULA Files
        shell: bash
        run: |
          if [[ -f "release/updatepkg/${{ matrix.platform }}/EULA.de_nightly" ]]; then
            cp -f \
              "release/updatepkg/${{ matrix.platform }}/EULA.de_nightly" \
              "release/updatepkg/${{ matrix.platform }}/EULA.de"
          fi

          if [[ -f "release/updatepkg/${{ matrix.platform }}/EULA.en_nightly" ]]; then
            cp -f \
              "release/updatepkg/${{ matrix.platform }}/EULA.en_nightly" \
              "release/updatepkg/${{ matrix.platform }}/EULA.en"
          fi

      #######################################################################
      # Main OpenCCU / Buildroot build
      #######################################################################
      - name: Build
        timeout-minutes: 300
        shell: bash
        run: |
          rm -rf release/OpenCCU-* buildroot-????.*

          make \
            DATE="${DATE}" \
            BR2_DL_DIR=/mnt/download \
            BR2_CCACHE_DIR="/mnt/ccache/${{ matrix.platform }}" \
            BR2_JLEVEL="${JLEVEL}" \
            PRODUCT="${{ matrix.platform }}" \
            clean-all \
            release

      #######################################################################
      # Show resulting files
      #######################################################################
      - name: Show Build Results
        shell: bash
        run: |
          echo "Release directory:"
          ls -lah release/

          echo
          echo "Expected OCI archive:"
          ls -lah \
            "release/OpenCCU-${VERSION}-${{ matrix.platform }}.tgz"

      #######################################################################
      # Upload OCI rootfs as Actions artifact
      #######################################################################
      - name: Upload OCI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCCU-${{ needs.prepare.outputs.build_version }}-${{ matrix.platform }}
          path: |
            release/OpenCCU-${{ needs.prepare.outputs.build_version }}-${{ matrix.platform }}.tgz
            release/OpenCCU-${{ needs.prepare.outputs.build_version }}-${{ matrix.platform }}.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  ###########################################################################
  # Assemble amd64 + arm64 OCI artifacts into one multi-arch container
  ###########################################################################
  oci-multiarch-build-push:
    name: OCI Multi-Arch Build + Push

    runs-on: ubuntu-24.04

    needs:
      - prepare
      - build

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      #######################################################################
      # Checkout to get the OCI Dockerfile
      #######################################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #######################################################################
      # Utilities
      #######################################################################
      - name: Install Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq

      #######################################################################
      # Download all OCI artifacts produced by matrix
      #######################################################################
      - name: Download OCI Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: OpenCCU-${{ needs.prepare.outputs.build_version }}-oci_*
          path: downloaded
          merge-multiple: true

      #######################################################################
      # Convert Docker-save tar archives contained in OpenCCU tgz files
      # to the files expected by buildroot-external/board/oci/Dockerfile
      #######################################################################
      - name: Extract OCI Root Filesystems
        shell: bash
        run: |
          rm -rf oci_build
          mkdir -p oci_build

          shopt -s nullglob

          FILES=(
            downloaded/OpenCCU-${{ needs.prepare.outputs.build_version }}-oci_*.tgz
          )

          if [[ ${#FILES[@]} -eq 0 ]]; then
            echo "No OCI tgz artifacts found."
            find downloaded -maxdepth 2 -type f -print || true
            exit 1
          fi

          for f in "${FILES[@]}"; do
            echo "Processing ${f}"

            BASENAME="$(basename "${f}" .tgz)"
            TMPDIR="$(mktemp -d)"

            tar -C "${TMPDIR}" -xf "${f}"

            if [[ ! -f "${TMPDIR}/manifest.json" ]]; then
              echo "manifest.json not found in ${f}"
              find "${TMPDIR}" -maxdepth 2 -type f -print
              exit 1
            fi

            LAYER="$(jq -r '.[0].Layers[0]' "${TMPDIR}/manifest.json")"

            if [[ -z "${LAYER}" || "${LAYER}" == "null" ]]; then
              echo "Could not determine OCI layer from ${f}"
              exit 1
            fi

            if [[ ! -f "${TMPDIR}/${LAYER}" ]]; then
              echo "Layer ${LAYER} not found in ${f}"
              exit 1
            fi

            mv \
              "${TMPDIR}/${LAYER}" \
              "oci_build/${BASENAME}.tar"

            rm -rf "${TMPDIR}"
          done

          echo "OCI build directory:"
          ls -lah oci_build

      #######################################################################
      # Generate GHCR tags
      #######################################################################
      - name: Generate Container Tags
        id: tags
        shell: bash
        run: |
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          BASE_TAG="ghcr.io/${REPOSITORY}"

          BRANCH="${GITHUB_REF_NAME}"

          # Docker tags cannot safely contain arbitrary branch characters.
          BRANCH_SAFE="$(
            echo "${BRANCH}" \
              | sed 's#[^A-Za-z0-9_.-]#-#g'
          )"

          UNIQUE_TAG="${BASE_TAG}:${{ needs.prepare.outputs.build_version }}-${{ needs.prepare.outputs.sha7 }}"
          BRANCH_TAG="${BASE_TAG}:snapshot-${BRANCH_SAFE}"

          echo "base_tag=${BASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "unique_tag=${UNIQUE_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

          echo "BASE_TAG=${BASE_TAG}"
          echo "UNIQUE_TAG=${UNIQUE_TAG}"
          echo "BRANCH_TAG=${BRANCH_TAG}"

      #######################################################################
      # Buildx
      #######################################################################
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #######################################################################
      # Login to GHCR
      #
      # No CR_PAT is needed for this repository workflow.
      #######################################################################
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #######################################################################
      # Metadata
      #######################################################################
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.tags.outputs.base_tag }}
          labels: |
            maintainer=OpenCCU OpenSource Team
            org.opencontainers.image.title=OpenCCU
            org.opencontainers.image.description=Alternative OS for your Homematic/Homematic IP CCU
            org.opencontainers.image.vendor=OpenCCU OpenSource Project
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.build_version }}-${{ needs.prepare.outputs.sha7 }}
            io.hass.name=OpenCCU
            io.hass.type=addon
            io.hass.arch=aarch64|amd64

      #######################################################################
      # Multi-architecture container
      #######################################################################
      - name: Build and Push Container Image
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: oci_build
          file: buildroot-external/board/oci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            tar_prefix=OpenCCU-${{ needs.prepare.outputs.build_version }}-oci_
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ steps.tags.outputs.unique_tag }}
            ${{ steps.tags.outputs.branch_tag }}

      #######################################################################
      # Result
      #######################################################################
      - name: Container Image Result
        shell: bash
        run: |
          echo "Digest:"
          echo "${{ steps.docker_build.outputs.digest }}"

          echo
          echo "Tags:"
          echo "${{ steps.tags.outputs.unique_tag }}"
          echo "${{ steps.tags.outputs.branch_tag }}"

      #######################################################################
      # Provenance
      #######################################################################
      - name: Attest Container Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.tags.outputs.base_tag }}
          subject-digest: ${{ steps.docker_build.outputs.digest }}
          push-to-registry: true
